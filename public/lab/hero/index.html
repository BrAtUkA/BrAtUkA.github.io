<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Hero layout lab</title>
<style>
:root{color-scheme:dark;--bg:#060405;--bone:#ece6e3;--ash:#8d8285;--hair:#241c1f;--signal:#ff3a4e}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--bone);font:15px/1.5 system-ui, sans-serif}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding:12px 16px;border-bottom:1px solid var(--hair)}
.bar h1{margin:0 8px 0 0;font-size:15px;font-weight:600}
.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.grp span{color:var(--ash);font:12px ui-monospace, monospace;text-transform:uppercase;letter-spacing:.08em;margin-right:4px}
button,a.b{font:inherit;font-size:13px;color:var(--ash);background:none;border:1px solid var(--hair);border-radius:999px;padding:5px 12px;cursor:pointer;text-decoration:none}
button:hover,a.b:hover{color:var(--bone)}
button[aria-pressed=true]{color:var(--bone);border-color:#5a4a50;background:#16100f}
.note{padding:10px 16px 0;color:var(--ash);font-size:14px;max-width:80ch}
.note b{color:var(--bone);font-weight:600}
.stage{position:relative;margin:12px 16px 16px;height:calc(100% - 150px);min-height:300px}
.screen{position:absolute;left:0;top:0;transform-origin:0 0;border:0;background:#000;box-shadow:0 0 0 1px var(--hair)}
.dim{position:absolute;right:0;top:-2px;color:var(--ash);font:12px ui-monospace, monospace}
@media (max-width:700px){.stage{height:70vh}}
</style>
</head>
<body>
<div class="bar">
  <h1>Hero layout</h1>
  <div class="grp" id="v"><span>Layout</span>
    <button data-v="" aria-pressed="false">Now</button>
    <button data-v="a" aria-pressed="true">A · Edge to edge</button>
    <button data-v="b" aria-pressed="false">B · Big B</button>
    <button data-v="c" aria-pressed="false">C · Centred</button>
  </div>
  <div class="grp" id="s"><span>Screen</span>
    <button data-s="1366x768">1366×768</button>
    <button data-s="1920x1080" aria-pressed="true">1920×1080</button>
    <button data-s="2560x1440">2560×1440</button>
    <button data-s="3440x1440">3440×1440</button>
    <button data-s="390x844">Phone</button>
  </div>
  <a class="b" id="open" href="../../?hl=a" target="_blank" rel="noopener">Open full size ↗</a>
</div>
<p class="note" id="note"></p>
<div class="stage" id="stage"><span class="dim" id="dim"></span><iframe class="screen" id="f" title="Home page preview"></iframe></div>
<script>
const NOTES = {
  '': '<b>Now:</b> the current hero. Everything sits in a 1280px column, the hero stops at 940px tall and the headline stops growing, so big screens feel condensed.',
  a: '<b>A · Edge to edge:</b> the hero fills the screen height, the words sit on the page edge instead of the middle column, and the headline and the B keep growing on big screens.',
  b: '<b>B · Big B:</b> the B is much larger and slightly to the left, so the headline sits over its lower-left part. Most dramatic; the words stay readable over the glass.',
  c: '<b>C · Centred:</b> the B centred above the words, the words centred under it. Calm and symmetric; on phones it is the same as now.',
};
let v = 'a', s = '1920x1080';
const f = document.getElementById('f'), stage = document.getElementById('stage');
function fit() {
  const [w, h] = s.split('x').map(Number), r = stage.getBoundingClientRect();
  const k = Math.min(r.width / w, (r.height - 16) / h, 1);
  f.style.width = w + 'px'; f.style.height = h + 'px'; f.style.transform = `translate(${(r.width - w * k) / 2}px, 16px) scale(${k})`;
  document.getElementById('dim').textContent = `${w}×${h} at ${Math.round(k * 100)}%`;
}
function go() {
  const u = '../../' + (v ? '?hl=' + v : '');
  f.src = u; document.getElementById('open').href = u; document.getElementById('note').innerHTML = NOTES[v];
  fit();
}
for (const g of ['v', 's']) document.getElementById(g).addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  [...b.parentNode.querySelectorAll('button')].forEach((x) => x.setAttribute('aria-pressed', x === b));
  if (g === 'v') v = b.dataset.v; else s = b.dataset.s; go();
});
addEventListener('resize', fit); go();
</script>
</body>
</html>
