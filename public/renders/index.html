/* Layout: the page is a dark room. One live object (the B behind reeded glass) opens it; after that the
   owner's own renders and screenshots carry the visuals. No cards: rows, hairlines and full-bleed strips. */
:root{
  color-scheme: dark;
  --void:#060405;     /* page ground: black with a trace of red */
  --hair:#231c1e;     /* hairlines */
  --bone:#ece6e3;     /* primary text */
  --ash:#8b8185;      /* secondary text */
  --signal:#ff3a4e;   /* the only UI accent: links, focus */
  --f-sans:"Geist", "Inter", "Segoe UI", system-ui, sans-serif;
  --f-mono:"Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --t-xs:.75rem; --t-s:.875rem; --t-m:1.0625rem; --t-l:clamp(1.25rem, 1rem + .9vw, 1.6rem);
  --t-xl:clamp(1.75rem, 1.2rem + 2.2vw, 2.6rem); --t-sec:clamp(2.6rem, 1.4rem + 4.4vw, 5.2rem); --t-hero:clamp(2.4rem, 1.4rem + 4.6vw, 5.2rem);
  --max:1280px;
}
*{box-sizing:border-box}
html,body{background:var(--void);color:var(--bone)}
body{font-family:var(--f-sans);font-size:var(--t-m);line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--signal);outline-offset:4px}
.gut{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:var(--max);margin:0 auto}
.mono{font-family:var(--f-mono);font-size:var(--t-xs);letter-spacing:.04em;color:var(--ash)}
.link{background-image:linear-gradient(currentColor,currentColor);background-size:100% 1px;background-repeat:no-repeat;background-position:0 100%;padding-bottom:2px;transition:color .2s}
.link:hover{color:var(--signal)}
::selection{background:var(--signal);color:var(--void)}

/* ── hero ── */
.hero{position:relative;z-index:1;height:clamp(560px, 92vh, 940px);overflow:hidden;isolation:isolate}   /* above the page's glass objects: they emerge from under it */
#glass{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0}
.poster{position:absolute;inset:0;z-index:0;display:none}
.poster.show{display:block}
.poster img{width:100%;height:100%;object-fit:cover;object-position:69% 48%;display:block}
@media (max-width:760px){ .poster img{object-position:50% 29%} }
.poster-capture .top,.poster-capture .intro,.poster-capture .poster-capture .hero::after{display:none}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:45%;z-index:1;pointer-events:none;
  background:linear-gradient(0deg, var(--void) 0%, color-mix(in srgb, var(--void) 60%, transparent) 40%, transparent 100%)}
.top{position:absolute;z-index:3;top:0;left:0;right:0;padding-top:calc(env(safe-area-inset-top, 0px) + 22px)}
.top .wrap{display:flex;align-items:center;gap:24px}
.brand{display:flex;align-items:center;gap:12px;font-weight:500;letter-spacing:.01em}
.brand img{width:22px;height:auto;display:block}
.nav{margin-left:auto;display:flex;gap:clamp(14px, 3vw, 32px);font-size:var(--t-s);color:var(--ash)}
.nav a:hover{color:var(--bone)}
.intro{position:absolute;z-index:2;left:0;right:0;bottom:clamp(36px, 7vh, 80px)}
.intro .wrap{display:grid;gap:22px}
.intro h1{margin:0;font-weight:500;font-size:var(--t-hero);line-height:1;letter-spacing:-.035em;max-width:11ch;text-wrap:balance}
.intro p{margin:0;max-width:34rem;color:var(--ash);font-size:var(--t-m)}
.intro p strong{color:var(--bone);font-weight:500}
.acts{display:flex;flex-wrap:wrap;gap:12px 28px;font-size:var(--t-s)}
@media (max-width:760px){ .nav a.opt{display:none} }


.hero.sub{height:clamp(340px, 50vh, 540px)}
.hero.sub .intro{top:calc(env(safe-area-inset-top, 0px) + 72px);bottom:var(--below, 24px);display:flex;align-items:center}
.hero.sub .intro .wrap{width:100%}
.hero.sub.games-on{--below:84px}
.hero.sub > .games{position:absolute;z-index:3;left:0;right:0;bottom:clamp(14px, 2.6vh, 26px);margin:0;
  padding-left:max(20px, env(safe-area-inset-left, 0px));padding-right:max(20px, env(safe-area-inset-right, 0px))}
@media (max-width:760px){ .hero.sub .intro{align-items:flex-end} .hero.sub.games-on{--below:78px} }
.hero.sub .intro h1{font-size:var(--t-sec);letter-spacing:-.04em;line-height:.95;max-width:none}
.hero.sub .intro p{max-width:30rem}
.nav a[aria-current=page]{color:var(--bone)}
.hero.sub::after{height:38%}
.wallwrap{position:relative;z-index:1;margin-top:-1px}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px 28px;padding-block:44px calc(36px + env(safe-area-inset-bottom, 0px));font-size:var(--t-s)}
.foot .home{display:inline-flex;align-items:center;gap:10px}
.foot .home svg{width:18px;height:18px;transform:scaleX(-1)}
</style>
